# Backup builder for when GitHub Actions is unavailable. Trigger manually.
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.6
    scripts:
      - name: Build unsigned IPA
        script: bash scripts/build_unsigned_ipa.sh "${CM_TAG:-v0.0.0-cm${BUILD_NUMBER}}"
    artifacts:
      - build/ipa/*.ipa
